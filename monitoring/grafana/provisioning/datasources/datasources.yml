apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: default
      defaultDatabase: default
    secureJsonData:
      password: ""
    editable: false

  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: false
    editable: false
